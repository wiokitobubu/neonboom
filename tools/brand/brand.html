<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NEON BOOM brand art</title>
<!--
  Draws every NEON BOOM brand image (app icon, adaptive icon layers,
  Play Store feature graphic, captioned store screenshots) with the
  game's own core renderer. tools/brand/build.mjs drives this page in headless
  Chrome and saves the PNGs. Open it in Chrome to preview: brand.html?k=icon
-->
<style>
  @font-face { font-family: 'Orbitron'; src: url(../../www/fonts/orbitron.woff2) format('woff2'); font-weight: 400 900; }
  @font-face { font-family: 'Rajdhani'; src: url(../../www/fonts/rajdhani-600.woff2) format('woff2'); font-weight: 600; }
  @font-face { font-family: 'Rajdhani'; src: url(../../www/fonts/rajdhani-700.woff2) format('woff2'); font-weight: 700; }
  html, body { margin: 0; background: #111; }
  canvas { display: block; max-width: 100vw; height: auto; }
</style>
<script src="../../www/js/config.js"></script>
<script src="../../www/js/render.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var U = NB.util, TAU = Math.PI * 2, MAX = NB.MAX_TIER;

  function cv(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  /* ---------- background: deep space, aurora, stars, neon grid ---------- */
  function space(ctx, w, h, o) {
    o = o || {};
    var m = Math.max(w, h);
    var g = ctx.createRadialGradient(w * 0.5, h * (o.glowY || 0.3), 0, w * 0.5, h * 0.45, m * 0.9);
    g.addColorStop(0, '#2C1066'); g.addColorStop(0.42, '#0F0630'); g.addColorStop(1, '#05030D');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    blob(ctx, w * 0.12, h * 0.08, m * 0.62, 'rgba(124,77,255,0.34)');
    blob(ctx, w * 0.95, h * 0.98, m * 0.62, 'rgba(255,43,214,0.26)');
    var r = U.rng(o.seed || 7), n = Math.round(w * h / (o.starDensity || 2600));
    for (var i = 0; i < n; i++) {
      var x = r() * w, y = r() * h * (o.horizon || 1), s = (0.5 + r() * 1.3) * m / 900, a = 0.25 + r() * 0.65;
      ctx.fillStyle = 'rgba(' + (r() < 0.25 ? '255,211,245' : r() < 0.4 ? '207,233,255' : '255,255,255') + ',' + a.toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(x, y, s, 0, TAU); ctx.fill();
    }
    if (o.horizon) grid(ctx, w, h, h * o.horizon, o.gridScale || 1);
  }
  function blob(ctx, x, y, r, col) {
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, col); g.addColorStop(1, col.replace(/[\d.]+\)$/, '0)'));
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  function grid(ctx, w, h, y0, k) {
    ctx.save();
    var glow = ctx.createLinearGradient(0, y0 - h * 0.08, 0, y0 + h * 0.05);
    glow.addColorStop(0, 'rgba(255,43,214,0)'); glow.addColorStop(0.6, 'rgba(255,43,214,0.22)'); glow.addColorStop(1, 'rgba(255,43,214,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, y0 - h * 0.08, w, h * 0.13);
    ctx.beginPath(); ctx.rect(0, y0, w, h - y0); ctx.clip();
    var fade = ctx.createLinearGradient(0, y0, 0, h);
    fade.addColorStop(0, 'rgba(155,107,255,0.05)'); fade.addColorStop(1, 'rgba(255,43,214,0.75)');
    ctx.strokeStyle = fade; ctx.lineWidth = Math.max(1, w / 420) * k;
    ctx.shadowColor = '#FF2BD6'; ctx.shadowBlur = 8 * k * w / 1000;
    var vx = w / 2, cols = 18;
    for (var i = -cols; i <= cols; i++) {
      ctx.beginPath(); ctx.moveTo(vx + i * w * 0.012, y0); ctx.lineTo(vx + i * w * 0.16, h + 2); ctx.stroke();
    }
    for (var j = 1; j < 14; j++) {
      var y = y0 + (h - y0) * Math.pow(j / 13, 2.1);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle = 'rgba(255,190,245,0.9)'; ctx.shadowColor = '#FF2BD6'; ctx.shadowBlur = 14 * k * w / 1000;
    ctx.fillRect(0, y0 - Math.max(1, w / 700), w, Math.max(1.5, w / 450));
    ctx.shadowBlur = 0;
  }

  /* ---------- one core (any tier) at (x, y), radius r ---------- */
  function core(ctx, tier, x, y, r, rot, alpha) {
    ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.translate(x, y); ctx.rotate(rot || 0);
    NB.drawCore(ctx, tier, r, 1);
    ctx.rotate(-(rot || 0));
    NB.drawGloss(ctx, r);
    ctx.restore();
  }

  /* ---------- the emblem: Singularity + orbit + two orbiters ---------- */
  function emblem(ctx, cx, cy, R, o) {
    o = o || {};
    var tilt = -0.36, rx = R * (o.orbit || 1.72), ry = rx * 0.3, or = R * 0.3;
    // light burst behind
    var b = ctx.createRadialGradient(cx, cy, R * 0.6, cx, cy, R * 2.4);
    b.addColorStop(0, 'rgba(185,140,255,0.45)'); b.addColorStop(0.45, 'rgba(255,43,214,0.12)'); b.addColorStop(1, 'rgba(255,43,214,0)');
    ctx.fillStyle = b; ctx.beginPath(); ctx.arc(cx, cy, R * 2.4, 0, TAU); ctx.fill();
    if (o.rays !== false) rays(ctx, cx, cy, R);
    function ring(front) {
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(tilt);
      var g = ctx.createLinearGradient(-rx, 0, rx, 0);
      g.addColorStop(0, '#00F0FF'); g.addColorStop(0.5, '#9B6BFF'); g.addColorStop(1, '#FF2BD6');
      ctx.strokeStyle = g; ctx.lineWidth = Math.max(1.2, R * 0.045); ctx.lineCap = 'round';
      ctx.shadowColor = '#B98CFF'; ctx.shadowBlur = R * 0.18;
      ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, front ? 0 : Math.PI, front ? Math.PI : TAU); ctx.stroke();
      ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = Math.max(0.6, R * 0.014); ctx.stroke();
      ctx.restore();
    }
    function at(a) { var ex = Math.cos(a) * rx, ey = Math.sin(a) * ry, c = Math.cos(tilt), s = Math.sin(tilt); return [cx + ex * c - ey * s, cy + ex * s + ey * c]; }
    var back = at(-2.2), front = at(0.75);
    ring(false);
    core(ctx, 1, back[0], back[1], or * 0.82, 0.4, 0.92);
    core(ctx, MAX, cx, cy, R, o.rot || 0.35);
    ring(true);
    core(ctx, 0, front[0], front[1], or, 0.2);
  }
  function rays(ctx, cx, cy, R) {
    ctx.save(); ctx.translate(cx, cy); ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < 12; i++) {
      var a = i / 12 * TAU + 0.13, len = R * (i % 2 ? 1.9 : 2.5);
      var g = ctx.createLinearGradient(0, 0, Math.cos(a) * len, Math.sin(a) * len);
      g.addColorStop(0.35, 'rgba(201,184,255,0.16)'); g.addColorStop(1, 'rgba(201,184,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.arc(0, 0, len, a - 0.05, a + 0.05); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  /* ---------- the wordmark ---------- */
  function wordmark(ctx, x, y, size, align) {
    ctx.save(); ctx.textAlign = align || 'center'; ctx.textBaseline = 'alphabetic';
    ctx.font = '900 ' + Math.round(size * 0.74) + 'px Orbitron'; ctx.letterSpacing = (size * 0.74 * 0.16).toFixed(1) + 'px';
    var yN = y, yB = y + size * 0.98;
    [[size * 0.6, 'rgba(0,240,255,0.55)'], [size * 0.3, '#00F0FF'], [size * 0.12, '#00F0FF'], [size * 0.04, '#FFFFFF']].forEach(function (p) {
      ctx.shadowColor = p[1]; ctx.shadowBlur = p[0]; ctx.fillStyle = '#EAFDFF'; ctx.fillText('NEON', x, yN);
    });
    ctx.font = '900 ' + size + 'px Orbitron'; ctx.letterSpacing = (size * 0.08).toFixed(1) + 'px';
    var g = ctx.createLinearGradient(0, yB - size * 0.78, 0, yB);
    g.addColorStop(0, '#FFFFFF'); g.addColorStop(0.3, '#FFC2F3'); g.addColorStop(0.66, '#FF2BD6'); g.addColorStop(1, '#8B5CFF');
    ctx.shadowColor = 'rgba(255,43,214,0.75)'; ctx.shadowBlur = size * 0.32; ctx.fillStyle = g; ctx.fillText('BOOM', x, yB);
    ctx.shadowBlur = 0; ctx.fillText('BOOM', x, yB);
    ctx.restore();
    return yB;
  }

  /* ================= the images ================= */
  var K = {};

  // Play Store icon (512) and the master icon: full square, Google rounds the corners.
  K.icon = function (c, w) {
    var x = c.getContext('2d');
    space(x, w, w, { horizon: 0.74, gridScale: 1.6, starDensity: 1800, glowY: 0.45 });
    emblem(x, w / 2, w * 0.47, w * 0.235);
  };
  // Adaptive icon, background layer (108dp; only the centre 72dp is ever visible).
  K.adaptiveBg = function (c, w) {
    var x = c.getContext('2d');
    space(x, w, w, { horizon: 0.69, gridScale: 1.4, starDensity: 1500, glowY: 0.45 });
  };
  // Adaptive icon, foreground layer: the emblem inside the 66dp safe circle.
  K.adaptiveFg = function (c, w) {
    emblem(c.getContext('2d'), w / 2, w / 2, w * 0.158, { orbit: 1.62, rays: false });
  };
  // Android 13+ themed icon: one-colour silhouette.
  K.monochrome = function (c, w) {
    var x = c.getContext('2d'), cx = w / 2, cy = w / 2, R = w * 0.15, tilt = -0.36, rx = R * 1.62, ry = rx * 0.3;
    x.fillStyle = '#fff'; x.strokeStyle = '#fff';
    x.lineWidth = R * 0.16; x.beginPath(); x.arc(cx, cy, R * 0.86, 0, TAU); x.stroke();
    x.save(); x.translate(cx, cy); x.rotate(tilt);
    x.lineWidth = R * 0.09; x.beginPath(); x.ellipse(0, 0, R * 0.55, R * 0.2, 0, 0, TAU); x.stroke();
    x.beginPath(); x.ellipse(0, 0, rx, ry, 0, 0.32, Math.PI - 0.32); x.stroke();
    x.beginPath(); x.ellipse(0, 0, rx, ry, 0, Math.PI + 0.62, TAU - 0.62); x.stroke();
    x.restore();
    x.beginPath(); x.arc(cx, cy, R * 0.2, 0, TAU); x.fill();
    var pts = [[0.75, 0.3], [-2.2, 0.24]];
    pts.forEach(function (p) {
      var ex = Math.cos(p[0]) * rx, ey = Math.sin(p[0]) * ry, cs = Math.cos(tilt), sn = Math.sin(tilt);
      x.beginPath(); x.arc(cx + ex * cs - ey * sn, cy + ex * sn + ey * cs, R * p[1], 0, TAU); x.fill();
    });
  };
  // Legacy launcher icons (Android 7): rounded square, and round.
  K.legacy = function (c, w, h, o) {
    var round = !!(o && o.round), x = c.getContext('2d'), m = w * 0.04, s = w - m * 2, full = cv(1024, 1024);
    K.icon(full, 1024);
    x.save(); x.beginPath();
    if (round) x.arc(w / 2, w / 2, s / 2, 0, TAU); else x.roundRect(m, m, s, s, s * 0.2);
    x.clip(); x.drawImage(full, m, m, s, s); x.restore();
  };
  K.legacyRound = function (c, w, h) { K.legacy(c, w, h, { round: true }); };
  // Google Play feature graphic, 1024 × 500.
  K.feature = function (c, w, h) {
    var x = c.getContext('2d');
    space(x, w, h, { horizon: 0.76, gridScale: 1.2, starDensity: 1400, glowY: 0.4 });
    blob(x, w * 0.74, h * 0.45, 360, 'rgba(155,107,255,0.28)');
    core(x, 5, w * 0.965, h * 0.14, 30, 0.4, 0.95);
    core(x, 2, w * 0.555, h * 0.16, 20, -0.3, 0.9);
    core(x, 6, w * 0.955, h * 0.84, 42, 0.9);
    core(x, 7, w * 0.535, h * 0.86, 36, 0.2);
    emblem(x, w * 0.755, h * 0.48, 112, { rays: true });
    var yB = wordmark(x, w * 0.27, h * 0.43, 104);
    x.save(); x.textAlign = 'center'; x.font = '700 24px Rajdhani'; x.letterSpacing = '7px';
    x.fillStyle = '#C9C2F2'; x.shadowColor = 'rgba(0,0,0,0.6)'; x.shadowBlur = 8;
    x.fillText('MERGE  ·  EVOLVE  ·  DETONATE', w * 0.27 + 4, yB + 50);
    x.restore();
  };
  // Captioned store screenshot, 1080 × 1920: a real game capture under a headline.
  K.shot = function (c, w, h, o) {
    var x = c.getContext('2d'), img = o.img;
    x.save(); x.scale(w / 1080, h / 1920); w = 1080; h = 1920; // designed at 1080 × 1920, drawn at any size
    space(x, w, h, { starDensity: 2200, glowY: 0.05 });
    x.save(); x.textAlign = 'center';
    var fs = 82;
    do { x.font = '900 ' + fs + 'px Orbitron'; x.letterSpacing = (fs * 0.06).toFixed(1) + 'px'; fs -= 2; }
    while (x.measureText(o.title).width > w - 110 && fs > 40);
    x.shadowColor = o.color || '#FF2BD6'; x.shadowBlur = 36; x.fillStyle = '#FFFFFF';
    x.fillText(o.title, w / 2 + 2, 196); x.shadowBlur = 0; x.fillText(o.title, w / 2 + 2, 196);
    x.font = '600 46px Rajdhani'; x.letterSpacing = '1px'; x.fillStyle = '#C9C2F2';
    x.fillText(o.sub, w / 2, 276);
    x.restore();
    var fw = 860, fh = fw * img.height / img.width, fx = (w - fw) / 2, fy = 370, rad = 56;
    x.save();
    x.shadowColor = o.color || '#FF2BD6'; x.shadowBlur = 70;
    x.fillStyle = '#05030D'; x.beginPath(); x.roundRect(fx, fy, fw, fh, rad); x.fill();
    x.restore();
    x.save(); x.beginPath(); x.roundRect(fx, fy, fw, fh, rad); x.clip(); x.drawImage(img, fx, fy, fw, fh); x.restore();
    var g = x.createLinearGradient(fx, fy, fx + fw, fy + fh);
    g.addColorStop(0, '#00F0FF'); g.addColorStop(0.5, '#9B6BFF'); g.addColorStop(1, '#FF2BD6');
    x.strokeStyle = g; x.lineWidth = 5; x.beginPath(); x.roundRect(fx, fy, fw, fh, rad); x.stroke();
    x.restore();
  };

  /* Renders one image and returns it as a PNG data URL. */
  window.NBBrand = {
    ready: document.fonts.load('900 80px Orbitron').then(function () { return document.fonts.load('700 30px Rajdhani'); })
      .then(function () { return document.fonts.load('600 30px Rajdhani'); }),
    render: function (kind, w, h, opts) {
      opts = opts || {};
      var c = document.getElementById('c');
      c.width = w; c.height = h || w;
      c.getContext('2d').clearRect(0, 0, c.width, c.height);
      function done() { K[kind](c, w, h || w, opts); return c.toDataURL(opts.type || 'image/png', 0.86); }
      if (!opts.src) return Promise.resolve(done());
      return new Promise(function (res, rej) {
        var im = new Image(); im.onload = function () { opts.img = im; res(done()); }; im.onerror = rej; im.src = opts.src;
      });
    }
  };

  // Preview in a browser: brand.html?k=icon&w=512
  var q = new URLSearchParams(location.search);
  if (q.get('k')) NBBrand.ready.then(function () { NBBrand.render(q.get('k'), +(q.get('w') || 512), +(q.get('h') || 0) || undefined); });
})();
</script>
</body>
</html>
